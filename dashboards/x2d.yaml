type: vertical-stack
cards:
  - type: horizontal-stack
    cards:
      - type: custom:mod-card
        card:
          type: picture-entity
          entity: image.x2d_20p6bj631101145_cover_image
          card_mod:
            style: |
              ha-card {
                height: 320px !important;
                width: 460px !important;
                margin-right: 0px !important;
              }
          show_name: false
          show_state: false
          fit_mode: contain
      - type: vertical-stack
        cards:
          - type: custom:mod-card
            card:
              show_name: false
              show_icon: true
              show_state: true
              type: glance
              entities:
                - entity: sensor.x2d_20p6bj631101145_left_nozzle_temperature
                  icon: mdi:printer-3d-nozzle-heat
                - entity: sensor.x2d_20p6bj631101145_right_nozzle_temperature
                  icon: mdi:printer-3d-nozzle-heat
                - entity: sensor.x2d_20p6bj631101145_bed_temperature
                  icon: mdi:train-car-flatbed
                - entity: sensor.x2d_20p6bj631101145_chamber_temperature
                  icon: mdi:minus-box-outline
                - entity: sensor.x2d_20p6bj631101145_chamber_temperature
              state_color: false
          - type: custom:mod-card
            card:
              type: custom:timer-bar-card
              entities:
                - entity: sensor.x2d_20p6bj631101145_print_progress
                  guess_mode: true
                  active_icon: mdi:printer-3d
                  start_time:
                    entity: sensor.x2d_20p6bj631101145_start_time
                  end_time:
                    entity: sensor.x2d_20p6bj631101145_end_time
              layout: full_row
              text_width: 0px
          - type: custom:mod-card
            card:
              type: custom:mushroom-chips-card
              chips:
                - entity: spacer
                - type: entity
                  entity: sensor.x2d_20p6bj631101145_print_progress
                  card_mod:
                    style: |
                      ha-card {
                        font-size: 3.7rem !important;
                      }
                - type: entity
                  entity: sensor.x2d_20p6bj631101145_remaining_time
                  card_mod:
                    style: |
                      ha-card {
                        font-size: 3.7rem !important;
                      }
                - type: entity
                  entity: sensor.x2d_20p6bj631101145_end_time
                  card_mod:
                    style: |
                      ha-card {
                        font-size: 3.7rem !important;
                      }
                - entity: spacer
              alignment: left
